version: 2
updates:
  - package-ecosystem: docker
    directory: /rapid-builder
    schedule:
      interval: daily
    ignore:
      - dependency-name: "*"
        update-types: [version-update:semver-major]
    groups:
      base-images:
        patterns: ["*"]

  # Security updates only: limit 0 disables version updates.
  - package-ecosystem: npm
    directory: /rapid-builder
    schedule:
      interval: daily
    open-pull-requests-limit: 0
    groups:
      npm-security:
        applies-to: security-updates
        patterns: ["*"]
