name: Rapid Builder CI

on:
  push:
    branches: [main]
    paths:
      - rapid-builder/**
      - .github/workflows/rapid-builder-ci.yaml
  pull_request:
    paths:
      - rapid-builder/**
      - .github/workflows/rapid-builder-ci.yaml

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    working-directory: rapid-builder

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: rapid-builder/.nvmrc
          cache: npm
          cache-dependency-path: rapid-builder/package-lock.json

      - run: npm ci

      - name: Lint and format check
        run: npm run lint

      # Runs even when the check above failed, so one run reports both.
      - name: Typecheck
        if: ${{ !cancelled() }}
        run: npm run typecheck

      - name: Test
        run: npm test

  # The end-to-end test needs the real rapid-buildgit and the bunny-enabled
  # rclone, which only the image has. Building rclone from source is the slow
  # part and caches well.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/build-push-action@v7
        with:
          context: rapid-builder
          target: e2e
          load: true
          tags: rapid-build-e2e
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - run: docker run --rm rapid-build-e2e

  # Only on main in the upstream repo, and only once both test jobs are green.
  publish:
    if: ${{ github.event_name == 'push' && github.repository == 'beyond-all-reason/rapid-hosting' }}
    needs: [ci, e2e]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/rapid-builder
          tags: |
            type=raw,value=latest
            type=sha,format=long

      - id: build
        uses: docker/build-push-action@v7
        with:
          context: rapid-builder
          target: runtime
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - uses: actions/attest-build-provenance@v4
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/rapid-builder
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
