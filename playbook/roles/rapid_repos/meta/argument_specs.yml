---
argument_specs:
  main:
    options:
      domain_name:
        required: true
        type: 'str'
        description: 'Full qialified domain name for repos'
      www_root:
        required: true
        type: 'str'
        description: 'HTTP root for repos'
      extra_repo_names:
        required: false
        type: 'list'
        elements: 'str'
        description: 'Names of repos served from this domain but built elsewhere'
      handover_git_root:
        required: false
        type: 'str'
        description: 'Where the git clone of a repo handed over to another builder is moved'
      handover_www_root:
        required: false
        type: 'str'
        description: 'Where the built files of a repo handed over to another builder are moved'
      repos:
        required: true
        type: 'list'
        description: 'List of repos to set up'
        elements: 'dict'
        options:
          name:
            required: true
            type: 'str'
            description: 'Name of package'
          origin:
            required: true
            type: 'str'
            description: 'Git repo url'
          branch:
            required: true
            type: 'str'
            description: 'Branch name to clone'
          state:
            required: false
            type: 'str'
            default: 'present'
            choices: ['present', 'absent']
            description: >-
              When absent, the repo configuration is removed and it stops being
              built and served, but its git clone and built files are kept.
